[package]
name = "fhe-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native TFHE-rs worker for the Phase 1 policy circuit."

[dependencies]
confidential-protocol = { path = "../protocol" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-keypair = "3.1"
solana-signer = "3"
tfhe = { version = "1.7.0", features = ["integer"] }

[dev-dependencies]
tempfile = "3"
