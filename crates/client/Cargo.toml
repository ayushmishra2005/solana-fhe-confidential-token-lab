[package]
name = "confidential-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Phase 1 client, local demo, and instruction builders."

[[bin]]
name = "confidential-lab"
path = "src/main.rs"

[dependencies]
anchor-lang = "1.1.2"
confidential-coordinator = { path = "../../programs/confidential-coordinator", features = ["no-entrypoint"] }
confidential-protocol = { path = "../protocol" }
fhe-worker = { path = "../fhe-worker" }
hex = "0.4"
agave-feature-set.workspace = true
agave-precompiles.workspace = true
agave-reserved-account-keys.workspace = true
litesvm = { version = "0.15.2", features = ["precompiles"] }
serde = { version = "1", features = ["derive"] }
solana-builtins.workspace = true
solana-compute-budget.workspace = true
solana-compute-budget-instruction.workspace = true
solana-fee.workspace = true
solana-program-runtime.workspace = true
solana-svm-callback.workspace = true
solana-svm-log-collector.workspace = true
solana-svm-timings.workspace = true
solana-svm-transaction.workspace = true
solana-syscalls.workspace = true
solana-system-program.workspace = true
solana-transaction-context.workspace = true
serde_json = "1"
solana-account = "4"
solana-address = "~2.6.1"
solana-clock = "~3.1.1"
solana-ed25519-program = "3"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-message = "4"
solana-signer = "3"
solana-transaction = "4"
